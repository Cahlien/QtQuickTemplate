[project]
name = "qtquicktemplate"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = [
    "cmake>=3.31",
    "conan>=2.0,<3",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "PyJWT>=2.8",
    "cryptography>=42.0",
]
dev = [
    { include-group = "test" },
]

[tool.uv]
default-groups = ["dev"]
