# Conan workspace definition.
#
# Lists all products (projects under active development) in this monorepo.
# Running `conan workspace install conanws.yml` resolves and installs
# dependencies for all listed products in a single pass, ensuring
# consistent version resolution across the workspace (single-version rule).
#
# Add a new project by appending its path here and creating a matching
# conanfile.py alongside that project's CMakeLists.txt.
#
# See: https://docs.conan.io/2/reference/commands/workspace.html

products:
  - path: app
